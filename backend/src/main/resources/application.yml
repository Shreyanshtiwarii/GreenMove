server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

greenmove:
  frontend-url: ${GREENMOVE_FRONTEND_URL:http://localhost:5173}
  google:
    routes-api-key: ${GOOGLE_ROUTES_API_KEY:}
  ev:
    ocm-api-key: ${OPEN_CHARGE_MAP_API_KEY:}
    corridor-km: ${EV_CHARGING_ROUTE_CORRIDOR_KM:5.0}

logging:
  level:
    root: INFO
    com.greenmove: DEBUG

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/postgres}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
